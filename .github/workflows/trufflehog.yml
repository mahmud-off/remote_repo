name: TruffleHog Secret Scan

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  trufflehog-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Важно: TruffleHog нужна полная история для сканирования
          fetch-depth: 0 
          
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          # Сканируем изменения между базовой веткой и текущим HEAD
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD