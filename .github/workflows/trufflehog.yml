name: TruffleHog Secret Scan

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  trufflehog-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          
      - name: Run TruffleHog (Full Repo Scan)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --no-verification