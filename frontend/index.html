<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Тапалка</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #1e1e2e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 30px;
    }
    h1 { font-size: 2rem; }
    #score { font-size: 4rem; font-weight: bold; }
    #tapBtn {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: none;
      background: #f38ba8;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      transition: transform 0.1s;
    }
    #tapBtn:active { transform: scale(0.9); }
    #resetBtn {
      background: none;
      border: 1px solid #fff;
      color: #fff;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
    #logsBtn {
      background: none;
      border: 1px solid #89b4fa;
      color: #89b4fa;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
    #logs {
      width: 90%;
      max-width: 600px;
      max-height: 250px;
      overflow-y: auto;
      background: #11111b;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Тапалка</h1>
  <div id="score">0</div>
  <button id="tapBtn">ТАП!</button>
  <div>
    <button id="resetBtn">Сброс</button>
    <button id="logsBtn">Логи</button>
  </div>
  <pre id="logs"></pre>

  <script>
    const API = "http://localhost:8080";
    const scoreEl = document.getElementById("score");
    const logsEl = document.getElementById("logs");

    async function loadScore() {
      try {
        const r = await fetch(API + "/count");
        const data = await r.json();
        scoreEl.textContent = data.score;
      } catch (e) { console.error(e); }
    }

    async function tap() {
      try {
        const r = await fetch(API + "/tap", { method: "POST" });
        const data = await r.json();
        scoreEl.textContent = data.score;
      } catch (e) { console.error(e); }
    }

    async function reset() {
      try {
        const r = await fetch(API + "/reset", { method: "POST" });
        const data = await r.json();
        scoreEl.textContent = data.score;
      } catch (e) { console.error(e); }
    }

    async function showLogs() {
      if (logsEl.style.display === "block") {
        logsEl.style.display = "none";
        return;
      }
      try {
        const r = await fetch(API + "/logs");
        const data = await r.json();
        logsEl.textContent = data.join("\n");
        logsEl.scrollTop = logsEl.scrollHeight;
        logsEl.style.display = "block";
      } catch (e) { console.error(e); }
    }

    document.getElementById("tapBtn").addEventListener("click", tap);
    document.getElementById("resetBtn").addEventListener("click", reset);
    document.getElementById("logsBtn").addEventListener("click", showLogs);
    loadScore();
  </script>
</body>
</html>
