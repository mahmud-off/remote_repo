<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Тапалка</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #1e1e2e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 30px;
    }
    h1 { font-size: 2rem; }
    #score { font-size: 4rem; font-weight: bold; }
    #tapBtn {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: none;
      background: #f38ba8;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      transition: transform 0.1s;
    }
    #tapBtn:active { transform: scale(0.9); }
    #resetBtn {
      background: none;
      border: 1px solid #fff;
      color: #fff;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Тапалка</h1>
  <div id="score">0</div>
  <button id="tapBtn">ТАП!</button>
  <button id="resetBtn">Сброс</button>

  <script>
    const API = "http://localhost:8080";
    const scoreEl = document.getElementById("score");

    async function loadScore() {
      try {
        const r = await fetch(API + "/count");
        const data = await r.json();
        scoreEl.textContent = data.score;
      } catch (e) { console.error(e); }
    }

    async function tap() {
      try {
        const r = await fetch(API + "/tap", { method: "POST" });
        const data = await r.json();
        scoreEl.textContent = data.score;
      } catch (e) { console.error(e); }
    }

    async function reset() {
      try {
        const r = await fetch(API + "/reset", { method: "POST" });
        const data = await r.json();
        scoreEl.textContent = data.score;
      } catch (e) { console.error(e); }
    }

    document.getElementById("tapBtn").addEventListener("click", tap);
    document.getElementById("resetBtn").addEventListener("click", reset);
    loadScore();
  </script>
</body>
</html>
